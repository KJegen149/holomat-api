<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phase 13 · Nav C · Edge-Swipe Rail</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    /* Edge-swipe rail — collapsed to a 6px luminous strip. Hovering or
       swiping from the left edge expands it into a fat, rounded rail. */
    .edge-strip {
      position: fixed; left: 0; top: 56px; bottom: 0;
      width: 8px;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(0,220,255,0.2) 12%,
        rgba(0,220,255,0.55) 50%,
        rgba(140,110,255,0.4) 75%,
        transparent 100%);
      box-shadow: 0 0 14px rgba(0,220,255,0.35);
      z-index: 20;
      cursor: pointer;
    }
    .edge-strip::after {
      content: '';
      position: absolute; right: -4px; top: 50%; transform: translateY(-50%);
      width: 4px; height: 64px;
      background: var(--cyan);
      border-radius: 4px;
      box-shadow: 0 0 12px var(--cyan);
      opacity: 0.6;
    }

    .rail {
      position: fixed; left: 18px; top: 50%;
      transform: translate(-110%, -50%);
      opacity: 0; pointer-events: none;
      transition: all 260ms cubic-bezier(.2,.7,.2,1);
      z-index: 25;

      display: flex; flex-direction: column; gap: 6px;
      padding: 14px 10px;
      background: var(--surface-hi);
      backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid var(--border-soft);
      border-radius: 28px;
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.55),
        0 0 32px rgba(0, 220, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    .rail.open {
      transform: translate(0, -50%);
      opacity: 1;
      pointer-events: auto;
    }

    .rail-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px 12px 12px;
      border: 0; background: transparent;
      color: var(--muted); cursor: pointer;
      border-radius: 18px;
      font-family: inherit;
      font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
      transition: all 180ms ease;
      width: 220px;
      text-align: left;
    }
    .rail-item:hover {
      color: var(--text); background: rgba(0, 220, 255, 0.05);
    }
    .rail-item.active {
      color: var(--cyan); background: rgba(0, 220, 255, 0.1);
      box-shadow: inset 0 0 16px rgba(0, 220, 255, 0.18);
    }
    .rail-item .ic {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 14px;
      background: rgba(0, 220, 255, 0.05);
      border: 1px solid rgba(0,220,255,0.12);
      flex-shrink: 0;
    }
    .rail-item.active .ic {
      background: rgba(0, 220, 255, 0.18);
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(0, 220, 255, 0.35);
    }
  </style>
</head>
<body>
  <script src="dashboard.js"></script>
  <script>
    const { initMockupPage, NAV_ITEMS, icon } = HolomatMockup;
    initMockupPage({
      label: 'Variant C · Edge-Swipe Rail · hover the left edge to expand',
      mountNav: (stage) => {
        const strip = document.createElement('div');
        strip.className = 'edge-strip';
        document.body.appendChild(strip);

        const rail = document.createElement('nav');
        rail.className = 'rail';
        rail.innerHTML = NAV_ITEMS.map((n, i) => `
          <button class="rail-item ${i === 0 ? 'active' : ''}" data-id="${n.id}">
            <span class="ic">${icon(n.icon, 18)}</span>
            <span>${n.label}</span>
          </button>
        `).join('');
        rail.addEventListener('click', e => {
          const b = e.target.closest('.rail-item');
          if (!b) return;
          rail.querySelectorAll('.rail-item').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
        });
        document.body.appendChild(rail);

        let openTimer = null;
        let closeTimer = null;

        function open() {
          clearTimeout(closeTimer);
          rail.classList.add('open');
        }
        function close() {
          rail.classList.remove('open');
        }

        // Hover edge strip → open
        strip.addEventListener('mouseenter', open);
        strip.addEventListener('click', open);

        // Auto-close when leaving rail
        rail.addEventListener('mouseleave', () => {
          closeTimer = setTimeout(close, 280);
        });
        rail.addEventListener('mouseenter', () => clearTimeout(closeTimer));

        // Wide hot zone for first 80px from left
        document.body.addEventListener('mousemove', (e) => {
          if (e.clientX < 28 && e.clientY > 80) open();
        });
      }
    });
  </script>
</body>
</html>
