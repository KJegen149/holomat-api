<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phase 13 · Nav A · Arc Dock</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    /* Floating arc dock — curved bottom-center bar.
       Touch targets are 56px; active item lifts + glows. */
    .arc-dock {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: flex-end; gap: 6px;
      padding: 14px 22px;
      background: var(--surface-hi);
      backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid var(--border-soft);
      border-radius: 80px 80px 32px 32px;
      box-shadow:
        0 -2px 24px rgba(0, 220, 255, 0.08),
        0 18px 44px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      z-index: 15;
    }
    .arc-dock::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0,220,255,0.08), transparent 60%);
    }
    .arc-item {
      width: 56px; height: 56px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px;
      border: 0; background: transparent; cursor: pointer;
      color: var(--muted);
      border-radius: 22px;
      transition: all 220ms cubic-bezier(.2,.7,.2,1);
      position: relative;
    }
    .arc-item .arc-label {
      font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase;
      opacity: 0; transform: translateY(4px);
      transition: all 200ms ease;
      position: absolute; bottom: -14px;
      white-space: nowrap;
    }
    .arc-item:hover {
      color: var(--text);
      background: rgba(0, 220, 255, 0.06);
      transform: translateY(-4px);
    }
    .arc-item:hover .arc-label {
      opacity: 1; transform: translateY(0);
    }
    .arc-item.active {
      color: var(--cyan);
      background: rgba(0, 220, 255, 0.14);
      box-shadow:
        inset 0 0 14px rgba(0, 220, 255, 0.25),
        0 0 26px rgba(0, 220, 255, 0.35),
        0 8px 18px rgba(0, 0, 0, 0.4);
      transform: translateY(-10px);
    }
    .arc-item.active::after {
      content: '';
      position: absolute; bottom: -22px; left: 50%;
      transform: translateX(-50%);
      width: 28px; height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 8px var(--cyan);
    }
  </style>
</head>
<body>
  <script src="dashboard.js"></script>
  <script>
    const { initMockupPage, NAV_ITEMS, icon } = HolomatMockup;
    initMockupPage({
      label: 'Variant A · Floating Arc Dock',
      mountNav: (stage) => {
        const dock = document.createElement('nav');
        dock.className = 'arc-dock';
        dock.innerHTML = NAV_ITEMS.map((n, i) => `
          <button class="arc-item ${i === 0 ? 'active' : ''}" data-id="${n.id}">
            ${icon(n.icon, 22)}
            <span class="arc-label">${n.label}</span>
          </button>
        `).join('');
        dock.addEventListener('click', e => {
          const btn = e.target.closest('.arc-item');
          if (!btn) return;
          dock.querySelectorAll('.arc-item').forEach(x => x.classList.remove('active'));
          btn.classList.add('active');
        });
        document.body.appendChild(dock);
      }
    });
  </script>
</body>
</html>
