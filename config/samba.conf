# Holomat Gallery — Samba share config
# Included from /etc/samba/smb.conf by setup_samba.sh
# Network share: \\KJLC-AI-01\HolomatGallery
#
# Guest-writable: anyone on the local network can drop images here.
# The smb_watcher (Phase 6) monitors this directory and auto-ingests
# new images into the Gallery app.

[HolomatGallery]
   comment       = Holomat Gallery — drop images to convert to 3D
   path          = /home/jarvis/holomat-api/smb_share
   browseable    = yes
   writable      = yes
   guest ok      = yes
   guest only    = yes
   create mask   = 0664
   directory mask= 0775
   force user    = jarvis
   force group   = jarvis
