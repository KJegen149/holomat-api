# Holomat — Samba share config
# Included from /etc/samba/smb.conf by setup_samba.sh
#
# Two guest-writable shares (anyone on the LAN can drop files):
#   HolomatGallery — images; the SMB watcher auto-ingests them into the Gallery
#   HolomatSTL     — .stl files; they appear in the Print tab for queuing

[HolomatGallery]
   comment       = Holomat Gallery — drop images to convert to 3D
   path          = /home/jarvis/holomat-api/smb_share
   browseable    = yes
   writable      = yes
   guest ok      = yes
   guest only    = yes
   create mask   = 0664
   directory mask= 0775
   force user    = jarvis
   force group   = jarvis

[HolomatSTL]
   comment       = Holomat STL drop — .stl files appear in the Print tab
   path          = /home/jarvis/holomat-api/scan_data/stls
   browseable    = yes
   writable      = yes
   guest ok      = yes
   guest only    = yes
   create mask   = 0664
   directory mask= 0775
   force user    = jarvis
   force group   = jarvis
