# ─────────────────────────────────────────────────────────────────────────────
# JARVIS Dashboard — Home Assistant Lovelace configuration
# Phase 3 — Holomat / Home Assistant Embedding
#
# SETUP INSTRUCTIONS:
#   1. In HA: Settings → Dashboards → Add Dashboard
#      Title: JARVIS  |  URL path: jarvis  |  Icon: mdi:hexagon-multiple
#   2. Click "EDIT DASHBOARD" → ⋮ menu → "Edit in YAML" → paste this file
#   3. For JARVIS styling, install via HACS:
#        Frontend → card-mod  (CSS theming)
#   4. To allow iframe embedding from Holomat, add to HA configuration.yaml:
#        http:
#          use_x_forwarded_for: true
#          trusted_proxies:
#            - 10.11.12.0/24   # adjust to your subnet
#      Then also set: Content-Security-Policy via a reverse proxy,
#      OR in HA Settings → General → allow framing from your Holomat host.
#
# ENTITY CUSTOMIZATION:
#   Replace placeholder entity IDs (marked with # ← CUSTOMIZE) with your own.
#   Holomat entities are auto-created via MQTT discovery — no changes needed there.
#
# JARVIS USER (kiosk access):
#   Settings → People → Add Person  |  Name: JARVIS  |  Allow Login: yes
#   Create a long-lived token for this user and set HA_TOKEN in Holomat .env.
#   Restrict dashboard access:  Settings → Dashboards → JARVIS → Visible to: JARVIS user only
# ─────────────────────────────────────────────────────────────────────────────

title: JARVIS
views:

  # ═══════════════════════════════════════════════════════════════════════════
  # TAB 1 — HOLOMAT STATUS
  # Sensor data published by the Holomat API via MQTT discovery.
  # These entities appear automatically once HA_MQTT_HOST is configured.
  # ═══════════════════════════════════════════════════════════════════════════
  - title: HOLOMAT
    icon: mdi:grid-large
    path: holomat
    cards:

      - type: markdown
        content: |
          ## ◈ HOLOMAT — SMART FABRICATION SURFACE
          *Real-time status from the Holomat API via MQTT discovery*

      - type: glance
        title: System Overview
        columns: 4
        entities:
          - entity: binary_sensor.holomat_calibration_valid
            name: Calibration
          - entity: binary_sensor.holomat_camera_online
            name: Camera
          - entity: binary_sensor.holomat_printer_configured
            name: Printer
          - entity: sensor.holomat_ws_clients
            name: Clients

      - type: entities
        title: Calibration
        entities:
          - entity: binary_sensor.holomat_calibration_valid
            name: Valid
          - entity: sensor.holomat_calibration_rmse
            name: RMSE
          - entity: sensor.holomat_calibration_points
            name: Point Count

      - type: entities
        title: System
        entities:
          - entity: sensor.holomat_phase
            name: Phase
          - entity: binary_sensor.holomat_camera_online
            name: Camera Online
          - entity: binary_sensor.holomat_printer_configured
            name: Printer Configured
          - entity: sensor.holomat_ws_clients
            name: Active WebSocket Clients

      - type: history-graph
        title: RMSE History
        hours_to_show: 24
        entities:
          - entity: sensor.holomat_calibration_rmse
            name: Calibration RMSE

  # ═══════════════════════════════════════════════════════════════════════════
  # TAB 2 — HOME OVERVIEW
  # Replace entity IDs with your actual lights, climate, and switches.
  # ═══════════════════════════════════════════════════════════════════════════
  - title: HOME
    icon: mdi:home-outline
    path: home
    cards:

      - type: markdown
        content: |
          ## ◈ HOME — OVERVIEW
          *Lights, climate, and primary controls*

      - type: light
        title: Lights                                       # ← CUSTOMIZE
        entity: light.living_room                          # ← CUSTOMIZE

      - type: thermostat
        entity: climate.main_thermostat                    # ← CUSTOMIZE
        name: Climate

      - type: entities
        title: Switches
        entities:
          - entity: switch.garage_door                     # ← CUSTOMIZE
          - entity: switch.front_porch_light               # ← CUSTOMIZE
          - entity: switch.back_yard_light                 # ← CUSTOMIZE

      - type: weather-forecast
        entity: weather.home                               # ← CUSTOMIZE
        forecast_type: daily

  # ═══════════════════════════════════════════════════════════════════════════
  # TAB 3 — MEDIA & CAMERAS
  # ═══════════════════════════════════════════════════════════════════════════
  - title: MEDIA
    icon: mdi:television-play
    path: media
    cards:

      - type: markdown
        content: |
          ## ◈ MEDIA — PLAYERS & CAMERAS

      - type: media-control
        entity: media_player.living_room_tv                # ← CUSTOMIZE

      - type: media-control
        entity: media_player.bedroom_speaker               # ← CUSTOMIZE

      - type: picture-glance
        title: Front Door
        entity: camera.front_door                          # ← CUSTOMIZE
        camera_image: camera.front_door                    # ← CUSTOMIZE
        entities:
          - entity: binary_sensor.front_door_motion        # ← CUSTOMIZE

      - type: picture-glance
        title: Backyard
        entity: camera.backyard                            # ← CUSTOMIZE
        camera_image: camera.backyard                      # ← CUSTOMIZE
        entities:
          - entity: binary_sensor.backyard_motion          # ← CUSTOMIZE

  # ═══════════════════════════════════════════════════════════════════════════
  # TAB 4 — 3D PRINTER
  # Bambu P1S status via bambulabs integration or MQTT.
  # Install: HACS → Bambu Lab integration (or configure MQTT sensors manually)
  # ═══════════════════════════════════════════════════════════════════════════
  - title: PRINTER
    icon: mdi:printer-3d
    path: printer
    cards:

      - type: markdown
        content: |
          ## ◈ BAMBU P1S — PRINT MONITOR
          *Install the Bambu Lab HACS integration for full printer control*

      # If using Bambu Lab HA integration (HACS):
      - type: entities
        title: Printer Status
        entities:
          - entity: sensor.bambu_p1s_print_status           # ← CUSTOMIZE (Bambu integration)
            name: Status
          - entity: sensor.bambu_p1s_current_file           # ← CUSTOMIZE
            name: File
          - entity: sensor.bambu_p1s_print_progress         # ← CUSTOMIZE
            name: Progress
          - entity: sensor.bambu_p1s_nozzle_temperature     # ← CUSTOMIZE
            name: Nozzle Temp
          - entity: sensor.bambu_p1s_bed_temperature        # ← CUSTOMIZE
            name: Bed Temp

      - type: gauge
        title: Print Progress
        entity: sensor.bambu_p1s_print_progress             # ← CUSTOMIZE
        min: 0
        max: 100
        unit: "%"
        needle: true
        segments:
          - from: 0
            color: "#ef4444"
          - from: 25
            color: "#f59e0b"
          - from: 75
            color: "#22c55e"

      # Holomat printer config status (from MQTT discovery)
      - type: entities
        title: Holomat Printer Link
        entities:
          - entity: binary_sensor.holomat_printer_configured
            name: Printer Configured in Holomat

  # ═══════════════════════════════════════════════════════════════════════════
  # TAB 5 — NETWORK  (Unifi)
  # Requires: Unifi integration (built-in HA or HACS)
  # Settings → Integrations → Add Integration → UniFi Network
  # ═══════════════════════════════════════════════════════════════════════════
  - title: NETWORK
    icon: mdi:lan
    path: network
    cards:

      - type: markdown
        content: |
          ## ◈ NETWORK — UNIFI
          *Requires the UniFi Network integration (Settings → Integrations)*

      - type: entities
        title: Connected Devices
        entities:
          - entity: sensor.unifi_gateway_wan_download_speed   # ← CUSTOMIZE
            name: WAN Download
          - entity: sensor.unifi_gateway_wan_upload_speed     # ← CUSTOMIZE
            name: WAN Upload
          - entity: sensor.unifi_gateway_clients              # ← CUSTOMIZE
            name: Connected Clients
          - entity: sensor.unifi_gateway_wlan_clients         # ← CUSTOMIZE
            name: Wi-Fi Clients

      - type: history-graph
        title: WAN Speed
        hours_to_show: 6
        entities:
          - entity: sensor.unifi_gateway_wan_download_speed   # ← CUSTOMIZE
            name: Download
          - entity: sensor.unifi_gateway_wan_upload_speed     # ← CUSTOMIZE
            name: Upload

      # Device tracker cards — add key hosts
      - type: entities
        title: Key Hosts
        entities:
          - entity: device_tracker.kjlc_ai_01                 # ← CUSTOMIZE
            name: KJLC-AI-01 (Holomat)
          - entity: device_tracker.bambu_p1s                  # ← CUSTOMIZE
            name: Bambu P1S

  # ═══════════════════════════════════════════════════════════════════════════
  # TAB 6 — MUSIC ASSISTANT
  # Requires: Music Assistant HACS integration
  # HACS → Integrations → Music Assistant
  # ═══════════════════════════════════════════════════════════════════════════
  - title: MUSIC
    icon: mdi:music
    path: music
    cards:

      - type: markdown
        content: |
          ## ◈ MUSIC ASSISTANT
          *Requires the Music Assistant HACS integration*

      - type: media-control
        entity: media_player.music_assistant_player          # ← CUSTOMIZE (MA player entity)

      - type: entities
        title: Active Players
        entities:
          - entity: media_player.living_room_ma              # ← CUSTOMIZE
            name: Living Room
          - entity: media_player.kitchen_ma                  # ← CUSTOMIZE
            name: Kitchen
          - entity: media_player.bedroom_ma                  # ← CUSTOMIZE
            name: Bedroom

  # ═══════════════════════════════════════════════════════════════════════════
  # TAB 7 — CALENDAR
  # Uses the built-in HA Calendar card.
  # Requires calendar entities configured in HA (Google, iCal, local, etc.)
  # ═══════════════════════════════════════════════════════════════════════════
  - title: CALENDAR
    icon: mdi:calendar-month
    path: calendar
    cards:

      - type: markdown
        content: |
          ## ◈ CALENDAR

      - type: calendar
        title: Schedule
        initial_view: dayGridMonth
        entities:
          - calendar.personal                                 # ← CUSTOMIZE
          - calendar.work                                     # ← CUSTOMIZE
          - calendar.holidays_in_united_states                # ← CUSTOMIZE (auto-added by HA)
