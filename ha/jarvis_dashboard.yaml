  # ══════════════════════════════════════════════════════════════════════════
  # TAB 4 — PRINTER  (NANN3R1S = Bambu P1S)
  # ══════════════════════════════════════════════════════════════════════════
  - title: PRINTER
    icon: mdi:printer-3d
    path: printer
    card_mod:
      style:
        .: |
          background: #050508 !important;
    cards:

      - type: markdown
        content: |
          ## ◈ NANN3R1S — BAMBU P1S
          *Live print telemetry via Bambu Lab integration*
        <<: *header

      - type: glance
        title: Printer Status
        columns: 3
        entities:
          - entity: binary_sensor.nann3r1s_online
            name: Online
          - entity: sensor.nann3r1s_print_status
            name: Status
          - entity: sensor.nann3r1s_current_stage
            name: Stage
        <<: *glance

      - type: picture-entity
        entity: camera.nann3r1s_camera
        name: Print Camera
        show_state: false
        card_mod:
          style: |
            ha-card { border: 1px solid #0e2a35; border-radius: 2px; overflow: hidden; box-shadow: 0 0 12px rgba(0,200,232,0.06); }

      - type: gauge
        title: Print Progress
        entity: sensor.nann3r1s_print_progress
        min: 0
        max: 100
        unit: "%"
        needle: true
        segments:
          - from: 0
            color: "#e83040"
          - from: 25
            color: "#e8a020"
          - from: 75
            color: "#00ff88"
        <<: *gauge

      - type: entities
        title: Job Info
        entities:
          - entity: sensor.nann3r1s_task_name
            name: Task
          - entity: sensor.nann3r1s_gcode_filename
            name: File
          - entity: sensor.nann3r1s_current_layer
            name: Layer
          - entity: sensor.nann3r1s_total_layer_count
            name: Total Layers
          - entity: sensor.nann3r1s_remaining_time
            name: Remaining
          - entity: sensor.nann3r1s_end_time
            name: Est. End
          - entity: select.nann3r1s_printing_speed
            name: Speed Profile
        <<: *rows

      - type: entities
        title: Temperatures
        entities:
          - entity: sensor.nann3r1s_nozzle_temperature
            name: Nozzle
          - entity: number.nann3r1s_nozzle_target_temperature
            name: Nozzle Target
          - entity: sensor.nann3r1s_bed_temperature
            name: Bed
          - entity: number.nann3r1s_bed_target_temperature
            name: Bed Target
          - entity: sensor.nann3r1s_temperature
            name: Chamber
          - entity: sensor.nann3r1s_humidity
            name: Humidity
        <<: *rows

      - type: history-graph
        title: Temperatures — 2h
        hours_to_show: 2
        entities:
          - entity: sensor.nann3r1s_nozzle_temperature
            name: Nozzle
          - entity: sensor.nann3r1s_bed_temperature
            name: Bed
          - entity: sensor.nann3r1s_temperature
            name: Chamber
        <<: *graph

      - type: entities
        title: Controls
        entities:
          - entity: button.nann3r1s_pause_printing
            name: Pause
          - entity: button.nann3r1s_resume_printing
            name: Resume
          - entity: button.nann3r1s_stop_printing
            name: Stop
          - entity: switch.nann3r1s_enable_camera
            name: Camera
          - entity: binary_sensor.nann3r1s_print_error
            name: Print Error
          - entity: binary_sensor.nann3r1s_hms_errors
            name: HMS Errors
        <<: *rows

      - type: entities
        title: Filament Trays
        entities:
          - entity: sensor.nann3r1s_active_tray
            name: Active Tray
          - entity: sensor.nann3r1s_tray_1
            name: Tray 1
          - entity: sensor.nann3r1s_tray_2
            name: Tray 2
          - entity: sensor.nann3r1s_tray_3
            name: Tray 3
          - entity: sensor.nann3r1s_tray_4
            name: Tray 4
          - entity: sensor.nann3r1s_external_spool
            name: External Spool
        <<: *rows

      - type: entities
        title: Holomat Printer Link
        entities:
          - entity: binary_sensor.holomat_printer_configured
            name: Configured in Holomat
        <<: *rows


