# ─────────────────────────────────────────────────────────────────────────────
# JARVIS Dashboard — Home Assistant Lovelace configuration
# Phase 3 — rebuilt with real entity IDs from ha_states export
# ─────────────────────────────────────────────────────────────────────────────

_card: &card
  card_mod:
    style: |
      ha-card {
        background:    #0a0d12;
        border:        1px solid #0e2a35;
        border-radius: 2px;
        box-shadow:    0 0 12px rgba(0,200,232,0.06);
      }
      .card-header, .header {
        color:          #00c8e8 !important;
        font-family:    'Rajdhani', sans-serif !important;
        font-weight:    700 !important;
        font-size:      13px !important;
        letter-spacing: 0.18em !important;
        text-transform: uppercase !important;
        padding:        12px 16px 6px !important;
        border-bottom:  1px solid #0e2a35 !important;
      }
      .card-content { padding: 8px 16px 12px !important; }

_rows: &rows
  card_mod:
    style: |
      ha-card {
        background:    #0a0d12;
        border:        1px solid #0e2a35;
        border-radius: 2px;
        box-shadow:    0 0 12px rgba(0,200,232,0.06);
      }
      .card-header {
        color:          #00c8e8 !important;
        font-family:    'Rajdhani', sans-serif !important;
        font-weight:    700 !important;
        font-size:      13px !important;
        letter-spacing: 0.18em !important;
        text-transform: uppercase !important;
        padding:        12px 16px 6px !important;
        border-bottom:  1px solid #0e2a35 !important;
      }
      .card-content { padding: 4px 0 8px !important; }
      hui-generic-entity-row {
        border-bottom: 1px solid #0e2a35 !important;
        padding: 8px 16px !important;
      }
      hui-generic-entity-row:last-child { border-bottom: none !important; }
      .info, .info > span:first-child {
        font-family:    'Rajdhani', sans-serif !important;
        font-size:      13px !important;
        letter-spacing: 0.08em !important;
        text-transform: uppercase !important;
        color:          #c8f0f8 !important;
      }
      .secondary { color: #3a7a8a !important; font-size: 10px !important; }
      state-badge { color: #00c8e8 !important; }

_header: &header
  card_mod:
    style: |
      ha-card { background: transparent; border: none; box-shadow: none; }
      ha-markdown { color: #3a7a8a !important; font-family: 'Rajdhani', sans-serif !important; font-size: 11px !important; letter-spacing: 0.1em !important; text-transform: uppercase !important; }
      ha-markdown h2 { color: #00c8e8 !important; font-size: 15px !important; font-weight: 700 !important; letter-spacing: 0.25em !important; border-bottom: 1px solid #0e2a35 !important; padding-bottom: 6px !important; margin-bottom: 4px !important; }
      ha-markdown em { color: #3a7a8a !important; font-style: normal !important; font-size: 10px !important; }

_glance: &glance
  card_mod:
    style: |
      ha-card { background: #0a0d12; border: 1px solid #0e2a35; border-radius: 2px; box-shadow: 0 0 12px rgba(0,200,232,0.06); }
      .card-header { color: #00c8e8 !important; font-family: 'Rajdhani', sans-serif !important; font-weight: 700 !important; font-size: 13px !important; letter-spacing: 0.18em !important; text-transform: uppercase !important; border-bottom: 1px solid #0e2a35 !important; }
      .entity .name { font-family: 'Rajdhani', sans-serif !important; font-size: 10px !important; letter-spacing: 0.12em !important; text-transform: uppercase !important; color: #3a7a8a !important; }
      .entity .state { font-family: 'JetBrains Mono', monospace !important; font-size: 12px !important; color: #00c8e8 !important; }

_graph: &graph
  card_mod:
    style: |
      ha-card { background: #0a0d12; border: 1px solid #0e2a35; border-radius: 2px; box-shadow: 0 0 12px rgba(0,200,232,0.06); }
      .card-header { color: #00c8e8 !important; font-family: 'Rajdhani', sans-serif !important; font-weight: 700 !important; font-size: 13px !important; letter-spacing: 0.18em !important; text-transform: uppercase !important; border-bottom: 1px solid #0e2a35 !important; }

_gauge: &gauge
  card_mod:
    style: |
      ha-card { background: #0a0d12; border: 1px solid #0e2a35; border-radius: 2px; box-shadow: 0 0 12px rgba(0,200,232,0.06); }
      .title { font-family: 'Rajdhani', sans-serif !important; color: #00c8e8 !important; font-size: 13px !important; letter-spacing: 0.18em !important; text-transform: uppercase !important; }
      .measurement { font-family: 'JetBrains Mono', monospace !important; color: #c8f0f8 !important; }

_media: &media
  card_mod:
    style: |
      ha-card { background: #0a0d12; border: 1px solid #0e2a35; border-radius: 2px; box-shadow: 0 0 12px rgba(0,200,232,0.06); color: #c8f0f8; }
      .title { font-family: 'Rajdhani', sans-serif !important; color: #00c8e8 !important; letter-spacing: 0.15em !important; text-transform: uppercase !important; }
      ha-icon-button { color: #00c8e8 !important; }

_picture: &picture
  card_mod:
    style: |
      ha-card { border: 1px solid #0e2a35; border-radius: 2px; overflow: hidden; box-shadow: 0 0 12px rgba(0,200,232,0.06); }
      .label { font-family: 'Rajdhani', sans-serif !important; color: #00c8e8 !important; letter-spacing: 0.15em !important; text-transform: uppercase !important; }

# ══════════════════════════════════════════════════════════════════════════════
title: JARVIS
views:

  # ══════════════════════════════════════════════════════════════════════════
  # TAB 1 — HOLOMAT
  # ══════════════════════════════════════════════════════════════════════════
  - title: HOLOMAT
    icon: mdi:grid-large
    path: holomat
    card_mod:
      style:
        .: |
          background: #050508 !important;
    cards:

      - type: markdown
        content: |
          ## ◈ HOLOMAT — SMART FABRICATION SURFACE
          *KJLC-AI-01 // Real-time telemetry via MQTT*
        <<: *header

      - type: glance
        title: System Overview
        columns: 4
        entities:
          - entity: binary_sensor.holomat_calibration_valid
            name: Calibration
          - entity: binary_sensor.holomat_camera_online
            name: Camera
          - entity: binary_sensor.holomat_printer_configured
            name: Printer Link
          - entity: sensor.holomat_active_clients
            name: Clients
        <<: *glance

      - type: entities
        title: Calibration
        entities:
          - entity: binary_sensor.holomat_calibration_valid
            name: Valid
          - entity: sensor.holomat_calibration_rmse
            name: RMSE
          - entity: sensor.holomat_calibration_points
            name: Point Count
        <<: *rows

      - type: entities
        title: System
        entities:
          - entity: sensor.holomat_current_phase
            name: Phase
          - entity: binary_sensor.holomat_camera_online
            name: Camera Online
          - entity: binary_sensor.holomat_printer_configured
            name: Printer Configured
          - entity: sensor.holomat_active_clients
            name: Active WebSocket Clients
          - entity: device_tracker.kjlc_ai_01
            name: KJLC-AI-01
        <<: *rows

      - type: history-graph
        title: Calibration RMSE — 24h
        hours_to_show: 24
        entities:
          - entity: sensor.holomat_calibration_rmse
            name: RMSE (px)
        <<: *graph

      - type: entities
        title: GitHub — holomat-api
        entities:
          - entity: sensor.kjegen149_holomat_api_latest_commit
            name: Latest Commit
          - entity: sensor.kjegen149_holomat_api_pull_requests
            name: Open PRs
          - entity: sensor.kjegen149_holomat_api_stars
            name: Stars
        <<: *rows


  # ══════════════════════════════════════════════════════════════════════════
  # TAB 2 — HOME
  # ══════════════════════════════════════════════════════════════════════════
  - title: HOME
    icon: mdi:home-outline
    path: home
    card_mod:
      style:
        .: |
          background: #050508 !important;
    cards:

      - type: markdown
        content: |
          ## ◈ HOME — OVERVIEW
          *Lights, presence, security*
        <<: *header

      - type: glance
        title: Presence
        columns: 2
        entities:
          - entity: person.kyle
            name: Kyle
          - entity: person.lexie
            name: Lexie
        <<: *glance

      - type: entities
        title: Lights
        entities:
          - entity: light.livingroom_lights
            name: Livingroom
          - entity: light.livingroom_lamp
            name: Lamp
          - entity: light.master_bedroom
            name: Master Bedroom
          - entity: light.bedroom_light1
            name: Bedroom Light 1
          - entity: light.wiz_rgbw_tunable_539146
            name: Bedroom Light 2
          - entity: light.basement_lights
            name: Basement
        <<: *rows

      - type: entities
        title: Scenes
        entities:
          - entity: scene.comfy_livingroom
            name: Comfy — Living Room
          - entity: scene.brightest_day_livingroom
            name: Brightest Day — Living Room
          - entity: scene.comfy
            name: Comfy — Bedroom
          - entity: scene.brightest_day
            name: Brightest Day — Bedroom
          - entity: scene.romance
            name: Romance
          - entity: scene.bed_time
            name: Bed Time
        <<: *rows

      - type: thermostat
        entity: climate.main_floor        # ← verify entity ID — none found in states export
        name: Main Floor
        card_mod:
          style: |
            ha-card { background: #0a0d12; border: 1px solid #0e2a35; border-radius: 2px; box-shadow: 0 0 12px rgba(0,200,232,0.06); color: #c8f0f8; }

      - type: entities
        title: Security
        entities:
          - entity: lock.front_door
            name: Front Door
          - entity: binary_sensor.front_door_door
            name: Front Door Sensor
          - entity: alarm_control_panel.doorbell_repeater_961f_security_system
            name: Doorbell Security
        <<: *rows

      - type: entities
        title: Vacuum
        entities:
          - entity: vacuum.clean_latifah
            name: Clean Latifah
        <<: *rows

      - type: weather-forecast
        entity: weather.forecast_home
        forecast_type: daily
        card_mod:
          style: |
            ha-card { background: #0a0d12; border: 1px solid #0e2a35; border-radius: 2px; box-shadow: 0 0 12px rgba(0,200,232,0.06); }
            .card-header { color: #00c8e8 !important; font-family: 'Rajdhani', sans-serif !important; font-weight: 700 !important; letter-spacing: 0.18em !important; text-transform: uppercase !important; border-bottom: 1px solid #0e2a35 !important; }
            .temp { color: #c8f0f8 !important; font-family: 'JetBrains Mono', monospace !important; }
            .templow { color: #3a7a8a !important; font-family: 'JetBrains Mono', monospace !important; }


